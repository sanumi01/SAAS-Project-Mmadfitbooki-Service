<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mamaad Consultant Limited - Professional Cloud Solutions, Data Analytics, and Business Intelligence services in Larkhall, Scotland, UK">
    <meta name="keywords" content="cloud solutions, data analytics, business intelligence, AWS, Azure, PostgreSQL, Power BI, Tableau, DevOps, Scotland">
    <meta name="author" content="Mamaad Consultant Limited">
    <title>Mamaad Consultant Limited - Cloud Solutions & Data Analytics Excellence</title>
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Mamaad Consultant Limited - Cloud Solutions & Data Analytics">
    <meta property="og:description" content="Expert cloud infrastructure, data analytics, and business intelligence solutions in Larkhall, Scotland, UK">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_GB">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Loading spinner styles */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            margin-top: 1rem;
            text-align: center;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Hide loading when React app loads */
        .app-loaded .loading-container {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-container">
        <div>
            <div class="loading-spinner"></div>
            <div class="loading-text">
                <div>Loading Mamaad Consultant Limited</div>
                <div style="font-size: 0.9rem; opacity: 0.8; margin-top: 0.5rem;">Cloud Solutions & Data Analytics</div>
            </div>
        </div>
    </div>
    
    <!-- React App Root -->
    <div id="root"></div>
    
    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Mamaad Consultant Limited",
        "description": "Professional cloud solutions, data analytics, and business intelligence consultancy",
        "url": "https://mamaadconsultant.com",
        "logo": "https://mamaadconsultant.com/logo.png",
        "address": {
            "@type": "PostalAddress",
            "addressLocality": "Larkhall",
            "addressRegion": "Scotland",
            "addressCountry": "United Kingdom"
        },
        "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "availableLanguage": "English"
        },
        "founder": [
            {
                "@type": "Person",
                "name": "Kolade Adio",
                "jobTitle": "Senior Director"
            }
        ],
        "employee": [
            {
                "@type": "Person",
                "name": "Maya Adio",
                "jobTitle": "Co-Director"
            },
            {
                "@type": "Person",
                "name": "Meggy Adio",
                "jobTitle": "Co-Director"
            }
        ],
        "serviceType": [
            "Cloud Infrastructure",
            "Database Engineering",
            "Business Intelligence",
            "DevOps & Automation",
            "Data Analytics",
            "System Integration"
        ]
    }
    </script>
    
    <script>
        // Hide loading screen when page is fully loaded
        window.addEventListener('load', function() {
            document.body.classList.add('app-loaded');
        });
    </script>
</body>
</html>
